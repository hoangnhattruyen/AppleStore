<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" width="100%" height="100%">
  <defs>
    <radialGradient id="microfiberGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f4f4f6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d0d0d5" stop-opacity="1"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="40" y="20" width="300" height="580" rx="56" fill="url(#microfiberGrad)" filter="url(#softShadow)"/>
  
  <!-- Raised Border Ring -->
  <rect x="52" y="32" width="276" height="556" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

  <!-- MagSafe Alignment Magnet Ring -->
  <circle cx="190" cy="300" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4.5" stroke-dasharray="8 4"/>
  <circle cx="190" cy="300" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="187" y="390" width="6" height="34" rx="3" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Apple MagSafe Text Inside -->
  <text x="190" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" fill-opacity="0.5" text-anchor="middle" letter-spacing="2">
    MagSafe
  </text>
  <text x="190" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">
    Designed by Apple in California
  </text>
</svg>